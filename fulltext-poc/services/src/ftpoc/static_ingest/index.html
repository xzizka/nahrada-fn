<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fulltext-poc &mdash; nahrát dokument</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f7f5;
    --fg: #1b1b18;
    --muted: #6b6b64;
    --border: #ddd9d0;
    --accent: #8a4b2a;
    --card: #ffffff;
    --ok: #2f6b3a;
    --err: #a3352b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1b18;
      --fg: #ede9e0;
      --muted: #a3a096;
      --border: #3a3833;
      --accent: #d98a5f;
      --card: #24231f;
      --ok: #6fbb7d;
      --err: #e2837a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 3rem 1.25rem 4rem;
  }
  h1 {
    font-size: 1.4rem;
    font-weight: 600;
    margin: 0 0 0.25rem;
  }
  .subtitle {
    color: var(--muted);
    font-size: 0.9rem;
    margin: 0 0 2rem;
  }
  .dropzone {
    border: 2px dashed var(--border);
    border-radius: 12px;
    padding: 2.5rem 1.5rem;
    text-align: center;
    background: var(--card);
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  .dropzone.drag {
    border-color: var(--accent);
    background: color-mix(in srgb, var(--accent) 8%, var(--card));
  }
  .dropzone p {
    margin: 0.25rem 0;
    color: var(--muted);
    font-size: 0.9rem;
  }
  .dropzone .main-line {
    color: var(--fg);
    font-size: 1rem;
    font-weight: 500;
  }
  input[type="file"] { display: none; }
  .chosen-file {
    margin-top: 1rem;
    font-size: 0.9rem;
    color: var(--fg);
    word-break: break-word;
  }
  button {
    margin-top: 1rem;
    width: 100%;
    padding: 0.7rem 1.1rem;
    font-size: 1rem;
    font-weight: 600;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  .status {
    margin-top: 1.25rem;
    font-size: 0.9rem;
    line-height: 1.5;
    min-height: 1.2em;
  }
  .status.ok { color: var(--ok); }
  .status.err { color: var(--err); }
  .status .meta {
    display: block;
    color: var(--muted);
    font-size: 0.8rem;
    margin-top: 0.25rem;
    word-break: break-all;
  }
  .status a { color: var(--accent); }
  footer {
    margin-top: 3rem;
    color: var(--muted);
    font-size: 0.78rem;
  }
  footer a { color: var(--accent); text-decoration: none; }
  footer a:hover { text-decoration: underline; }
</style>
</head>
<body>
<main>
  <h1>Nahrát dokument</h1>
  <p class="subtitle">Nahraný soubor se automaticky extrahuje a zaindexuje na pozadí.</p>

  <div class="dropzone" id="dropzone" tabindex="0" role="button" aria-label="Vybrat nebo přetáhnout soubor">
    <p class="main-line" id="dz-main">Klikněte pro výběr souboru, nebo ho sem přetáhněte</p>
    <p>PDF a další formáty podporované Apache Tika</p>
  </div>
  <input type="file" id="file-input">
  <div class="chosen-file" id="chosen-file"></div>

  <button type="button" id="upload-btn" disabled>Nahrát</button>

  <p class="status" id="status" role="status"></p>

  <footer>fulltext-poc &middot; volá <code>POST /documents</code> na tomto ingest-api &middot;
    <a id="search-link" href="#">otevřít vyhledávání</a>
  </footer>
</main>

<script>
(function () {
  "use strict";

  const dropzone = document.getElementById("dropzone");
  const fileInput = document.getElementById("file-input");
  const chosenFileEl = document.getElementById("chosen-file");
  const uploadBtn = document.getElementById("upload-btn");
  const statusEl = document.getElementById("status");
  const searchLink = document.getElementById("search-link");

  // search-api runs as a separate service on port 8080; build the link from
  // whatever host the user actually used to reach THIS page (localhost, a
  // Tailscale IP, a MagicDNS name, ...) rather than hardcoding "localhost".
  searchLink.href = `${window.location.protocol}//${window.location.hostname}:8080/`;

  let selectedFile = null;

  function selectFile(file) {
    selectedFile = file;
    chosenFileEl.textContent = file
      ? `${file.name} (${(file.size / 1024).toFixed(1)} kB)`
      : "";
    uploadBtn.disabled = !file;
    statusEl.textContent = "";
    statusEl.className = "status";
  }

  dropzone.addEventListener("click", () => fileInput.click());
  dropzone.addEventListener("keydown", (event) => {
    if (event.key === "Enter" || event.key === " ") {
      event.preventDefault();
      fileInput.click();
    }
  });

  fileInput.addEventListener("change", () => {
    selectFile(fileInput.files[0] || null);
  });

  ["dragenter", "dragover"].forEach((eventName) => {
    dropzone.addEventListener(eventName, (event) => {
      event.preventDefault();
      dropzone.classList.add("drag");
    });
  });
  ["dragleave", "drop"].forEach((eventName) => {
    dropzone.addEventListener(eventName, (event) => {
      event.preventDefault();
      dropzone.classList.remove("drag");
    });
  });
  dropzone.addEventListener("drop", (event) => {
    const file = event.dataTransfer.files[0];
    if (file) selectFile(file);
  });

  uploadBtn.addEventListener("click", async () => {
    if (!selectedFile) return;

    uploadBtn.disabled = true;
    statusEl.className = "status";
    statusEl.textContent = "Nahrávám…";

    const formData = new FormData();
    formData.append("file", selectedFile, selectedFile.name);

    try {
      const response = await fetch("/documents", { method: "POST", body: formData });
      const body = await response.json();

      if (!response.ok) {
        statusEl.className = "status err";
        statusEl.textContent = `Chyba ${response.status}: ${body.detail || JSON.stringify(body)}`;
        return;
      }

      selectedFile = null;
      chosenFileEl.textContent = "";
      fileInput.value = "";

      statusEl.className = "status ok";
      statusEl.innerHTML =
        "Nahráno. Zpracovává se na pozadí, za pár sekund bude vyhledatelné." +
        `<span class="meta">sha256: ${body.sha256}\nstatus: ${body.status}</span>`;
    } catch (err) {
      statusEl.className = "status err";
      statusEl.textContent = `Nahrání selhalo: ${err.message}`;
    } finally {
      uploadBtn.disabled = !selectedFile;
    }
  });
})();
</script>
</body>
</html>
