[project]
name = "ftpoc"
version = "0.1.0"
description = "Fulltext search ingest/query pipeline (RustFS + Tika + OpenSearch) PoC"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "boto3>=1.35",
    "httpx>=0.27",
    "opensearch-py>=2.7",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "redis>=5.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "reportlab>=4.2",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13",
    "ruff>=0.7",
    "boto3-stubs[s3]>=1.35",
    "types-redis>=4.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ftpoc"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
