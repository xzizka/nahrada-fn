---
# Non-secret deployment settings. Secrets referenced below (vault_*) live in
# group_vars/all/vault.yml - copy vault.yml.example, fill it in, then
# encrypt it with `ansible-vault encrypt group_vars/all/vault.yml`.

ftpoc_deploy_dir: /opt/ftpoc

# See fulltext-poc/README.md "Accessing this from outside the host":
#   127.0.0.1     -> only this host
#   a Tailscale IP -> only your tailnet (recommended for real remote access)
#   0.0.0.0       -> any network this host is on (only with your own firewall)
ftpoc_bind_addr: "127.0.0.1"
ftpoc_public_host: "localhost"
ftpoc_scanner_interval_seconds: 60

# Set to true (e.g. -e ftpoc_run_smoke_tests=true) to also run `make probe`
# and `make hello` against the real deployed stack after bootstrap.
ftpoc_run_smoke_tests: false

# --- secrets (defined in group_vars/all/vault.yml) ---
ftpoc_rustfs_access_key: "{{ vault_rustfs_access_key }}"
ftpoc_rustfs_secret_key: "{{ vault_rustfs_secret_key }}"
ftpoc_opensearch_admin_password: "{{ vault_opensearch_admin_password }}"
ftpoc_postgres_user: "{{ vault_postgres_user }}"
ftpoc_postgres_password: "{{ vault_postgres_password }}"
ftpoc_postgres_db: "{{ vault_postgres_db }}"
