---
- name: Fail on unsupported OS family
  ansible.builtin.fail:
    msg: >-
      This role only supports the Debian and RedHat OS families
      (found: {{ ansible_os_family }}).
  when: ansible_os_family not in ["Debian", "RedHat"]

# fulltext-poc/README.md: "OpenSearch will not start otherwise."
- name: Set vm.max_map_count for OpenSearch
  ansible.posix.sysctl:
    name: vm.max_map_count
    value: "262144"
    sysctl_set: true
    state: present
    reload: true
    sysctl_file: /etc/sysctl.d/99-opensearch.conf

- name: Install prerequisite packages (Debian family)
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - python3-apt
      - rsync
      - make
    state: present
    update_cache: true
  when: ansible_os_family == "Debian"

- name: Ensure apt keyrings directory exists (Debian family)
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  when: ansible_os_family == "Debian"

- name: Download Docker's official GPG key (Debian family)
  ansible.builtin.get_url:
    url: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
  when: ansible_os_family == "Debian"

- name: Add the Docker apt repository (Debian family)
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}
      signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/{{ ansible_distribution | lower }}
      {{ ansible_distribution_release }} stable
    filename: docker
    state: present
  when: ansible_os_family == "Debian"

- name: Install Docker Engine + Compose plugin (Debian family)
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true
  when: ansible_os_family == "Debian"

- name: Install prerequisite packages (RedHat family)
  ansible.builtin.dnf:
    name:
      - dnf-plugins-core
      - rsync
      - make
    state: present
  when: ansible_os_family == "RedHat"

- name: Add the Docker CE repository (RedHat family)
  ansible.builtin.yum_repository:
    name: docker-ce-stable
    description: Docker CE Stable
    baseurl: "https://download.docker.com/linux/rhel/$releasever/$basearch/stable"
    gpgcheck: true
    gpgkey: "https://download.docker.com/linux/rhel/gpg"
  when: ansible_os_family == "RedHat"

- name: Install Docker Engine + Compose plugin (RedHat family)
  ansible.builtin.dnf:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
  when: ansible_os_family == "RedHat"

- name: Ensure the docker service is enabled and running
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

- name: Add deploy user(s) to the docker group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_users | default([]) }}"
